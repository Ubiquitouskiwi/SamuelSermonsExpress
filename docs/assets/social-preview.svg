<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Samuel's Sermons</title>
  <desc id="desc">Samuel's Sermons social preview: an open book under a gold monogram S beside the name Samuel's Sermons and the tagline "A lifetime of sermons, preserved and transcribed by volunteers."</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF6"/>
      <stop offset="1" stop-color="#EEE8DD"/>
    </linearGradient>
  </defs>

  <!-- Background: warm ivory, like the site -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Faint ruled manuscript lines along the bottom right -->
  <g stroke="#C2A66E" stroke-width="2" opacity="0.18">
    <line x1="760" y1="560" x2="1280" y2="560"/>
    <line x1="700" y1="588" x2="1280" y2="588"/>
    <line x1="640" y1="616" x2="1280" y2="616"/>
  </g>
  <rect x="0" y="628" width="1280" height="12" fill="#1F2A38"/>
  <rect x="0" y="624" width="1280" height="4" fill="#C2A66E"/>

  <!-- Logo (256-unit artwork scaled to 384px) -->
  <g transform="translate(112 128) scale(1.5)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="#1F2A38"/>
    <path d="M8 200 H248 V192 Q248 248 192 248 H64 Q8 248 8 192 Z" fill="#141B24"/>

    <!-- Monogram: the favicon's gold ring and italic S -->
    <circle cx="128" cy="86" r="44" fill="none" stroke="#C2A66E" stroke-width="5"/>
    <text x="128" y="108" text-anchor="middle" font-family="Baskerville, Libre Baskerville, Georgia, serif"
          font-size="64" font-weight="700" font-style="italic" fill="#E3CFA3">S</text>

    <!-- Open book -->
    <path d="M128 168 Q96 150 44 154 V208 Q96 204 128 222 Z" fill="#F7F3EC"/>
    <path d="M128 168 Q160 150 212 154 V208 Q160 204 128 222 Z" fill="#F1EBE1"/>
    <path d="M128 168 V222" stroke="#857B6D" stroke-width="2.5"/>
    <g fill="none" stroke="#C2A66E" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <path d="M58 170 Q90 168 116 178"/>
      <path d="M58 182 Q90 180 116 190"/>
      <path d="M58 194 Q90 192 116 202"/>
      <path d="M140 178 Q166 168 198 170"/>
      <path d="M140 190 Q166 180 198 182"/>
      <path d="M140 202 Q166 192 198 194"/>
    </g>
  </g>

  <!-- Wordmark and tagline -->
  <g font-family="Baskerville, Libre Baskerville, Georgia, serif">
    <text x="574" y="238" font-size="96" font-weight="700" fill="#1F2A38">Samuel's</text>
    <text x="574" y="334" font-size="96" font-weight="700" fill="#1F2A38">Sermons</text>
    <rect x="578" y="364" width="96" height="6" rx="3" fill="#C2A66E"/>
    <text x="576" y="424" font-size="36" fill="#23201C">A lifetime of sermons, preserved</text>
    <text x="576" y="470" font-size="36" fill="#23201C">and transcribed by volunteers.</text>
  </g>
  <text x="576" y="530" font-family="Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500"
        fill="#6E5420">Scanned archive  ·  Transcription workbench  ·  Peer review</text>
</svg>
